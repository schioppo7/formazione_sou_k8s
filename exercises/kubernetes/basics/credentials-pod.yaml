apiVersion: v1
kind: Pod
metadata:
  name: my-first-pod
spec:
  restartPolicy: Never
  containers:
    - name: my-first-container
      image: alpine
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      env:
        - name: APP_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-credentials
              key: username
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-credentials
              key: password
