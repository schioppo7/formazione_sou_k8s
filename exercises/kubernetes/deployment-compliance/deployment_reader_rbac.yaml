---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-reader
  namespace: devops-training

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployment-reader-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: read-deployments-global
subjects:
  - kind: ServiceAccount
    name: cluster-reader
    namespace: devops-training
roleRef:
  kind: ClusterRole
  name: deployment-reader-role
  apiGroup: rbac.authorization.k8s.io
