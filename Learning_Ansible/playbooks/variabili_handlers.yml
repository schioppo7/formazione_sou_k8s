---
- name: Configurazione Variabili
  hosts: rocky9
  become: true
  
  vars:
    pacchetto_web: httpd
    titolo_pagina: "Benvenuto al mio laboratorio Ansible!"
    utente_creatore: "Davide Ulizi (me)"
  
  tasks:
    - name: 1. Verifica connessione con ping
      ansible.builtin.ping:
    - name: 2. Installazione server web Apache usando variabile
      ansible.builtin.yum:
        name: "{{ pacchetto_web }}"
        state: present
    - name: 3. Avvio servizio Apache
      ansible.builtin.systemd:
        name: "{{ pacchetto_web }}"
        state: started
        enabled: true
    - name: 4. Copia file index.html sul server con variabile
      ansible.builtin.copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>{{ titolo_pagina }}</title>
          </head>
          <body>
              <h1>Questa pagina è stata configurata con Ansible su Rocky Linux 9</h1>
              <p>Creato da {{ utente_creatore }}</p>
          </body>
          </html>
        dest: /var/www/html/index.html
        owner: apache
        group: apache
        mode: '0644'
      notify: Riavvio di Apache
    - name: 5. Apri la porta HTTP nel firewall
      ansible.builtin.firewalld:
        service: http
        permanent: true
        state: enabled
        immediate: true

  handlers:
   - name: Riavvio di Apache
     ansible.builtin.systemd:
       name: "{{ pacchetto_web }}"
       state: restarted 