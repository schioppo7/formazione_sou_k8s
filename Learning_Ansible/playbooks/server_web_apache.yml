---
- name: Configurazione del server web Apache su rocky linux 9
  hosts: rocky9
  become: true
  
  tasks:
    - name: 1. Verifica connessione con ping
      ansible.builtin.ping:
    - name: 2. Installazione server web Apache
      ansible.builtin.yum:
        name: httpd
        state: present
    - name: 3. Avvio servizio Apache
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true
    - name: 4. Copia file index.html sul server
      ansible.builtin.copy:
        src: ../index.html
        dest: /var/www/html/index.html
        owner: apache
        group: apache
        mode: '0644'
    - name: 5. Apri la porta HTTP nel firewall
      ansible.builtin.firewalld:
        service: http
        permanent: true
        state: enabled
        immediate: true